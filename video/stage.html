<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Explainer stage</title>
    <style>
      /* the site's own typeface, from the bundled package, so it renders offline */
      @font-face {
        font-family: "Nunito Variable";
        font-style: normal;
        font-display: block;
        font-weight: 200 1000;
        src: url("../node_modules/@fontsource-variable/nunito/files/nunito-latin-wght-normal.woff2") format("woff2-variations");
      }
      html,
      body {
        margin: 0;
        background: #000;
      }
      body {
        display: flex;
        min-height: 100vh;
        align-items: center;
        justify-content: center;
      }
      /* the frame: 720×1280, 9:16 like the site's player */
      #stage {
        position: relative;
        width: 720px;
        height: 1280px;
        overflow: hidden;
        background: #080706;
        font-family: "Nunito Variable", Nunito, system-ui, sans-serif;
      }
      .mono {
        font-family: ui-monospace, "SF Mono", SFMono-Regular, Menlo, Consolas, monospace;
      }
      .layer {
        position: absolute;
        inset: 0;
      }
      .blob {
        position: absolute;
        border-radius: 50%;
        filter: blur(90px);
        will-change: transform;
      }
      svg.fill {
        position: absolute;
        left: 0;
        top: 0;
        overflow: visible;
      }
      .title {
        position: absolute;
        left: 60px;
        right: 60px;
        top: 50%;
        transform: translateY(-50%);
        text-align: center;
        color: #fff;
        font-weight: 700;
        font-size: 54px;
        line-height: 1.12;
        letter-spacing: -0.02em;
      }
      .title span {
        display: inline-block;
        white-space: pre;
      }
      /* a label on the cave's walls: a dark pill, like the site's inputs */
      .pill {
        position: absolute;
        display: flex;
        align-items: center;
        gap: 10px;
        white-space: nowrap;
        padding: 10px 18px;
        border-radius: 999px;
        background: rgba(20, 18, 16, 0.86);
        border: 1.5px solid rgba(255, 255, 255, 0.12);
        color: #fff;
        font-size: 22px;
        font-weight: 700;
        letter-spacing: -0.01em;
        box-shadow: 0 14px 34px rgba(0, 0, 0, 0.45);
        backdrop-filter: blur(8px);
      }
      .pill img {
        width: 30px;
        height: 30px;
        border-radius: 8px;
        object-fit: cover;
      }
      /* a card as the site draws them (dark theme) */
      .card {
        position: absolute;
        border-radius: 26px;
        background: #1c1c20;
        box-shadow: 0 0 0 1.5px rgba(255, 255, 255, 0.08), 0 24px 60px -20px rgba(0, 0, 0, 0.8);
        color: #f4f2f0;
      }
      .caps {
        color: rgba(244, 242, 240, 0.55);
        font-size: 15px;
        font-weight: 800;
        letter-spacing: 0.12em;
        text-transform: uppercase;
      }
      /* a phone: bezel, screen, and a few layers of edge for depth */
      .phone {
        position: absolute;
        left: 50%;
        top: 50%;
        width: 370px;
        height: 802px;
        margin: -401px 0 0 -185px;
        transform-style: preserve-3d;
      }
      .phone .edge {
        position: absolute;
        inset: 0;
        border-radius: 58px;
        background: #121214;
      }
      .phone .body {
        position: absolute;
        inset: 0;
        border-radius: 58px;
        background: #1b1b1e;
        padding: 12px;
        box-sizing: border-box;
        box-shadow: 0 0 0 1.5px rgba(255, 255, 255, 0.14) inset;
      }
      .phone .screen {
        position: relative;
        width: 100%;
        height: 100%;
        border-radius: 46px;
        overflow: hidden;
        /* the site's dark background, under the shorter-than-screen captures */
        background: #101114;
      }
      .phone .screen img {
        position: absolute;
        left: 0;
        top: 0;
        width: 100%;
        display: block;
      }
      .phone .shine {
        position: absolute;
        inset: 0;
        border-radius: 58px;
        pointer-events: none;
        background: linear-gradient(135deg, rgba(255, 255, 255, 0.16), transparent 38%);
      }
      /* subtitles for the captioned copy; mirror src/components/ExplainerSubtitles.tsx */
      .captions {
        position: absolute;
        left: 0;
        right: 0;
        bottom: 8%;
        z-index: 60;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 0.12em;
        font-size: 38px;
        font-weight: 700;
        line-height: 1.2;
        letter-spacing: -0.005em;
        text-align: center;
      }
      /* the sentence being spoken: a dark bar per line */
      .cap-line {
        white-space: nowrap;
        padding: 0.06em 0.3em 0.1em;
        border-radius: 0.3em;
        background: rgba(22, 22, 24, 0.84);
        color: #fff;
        box-shadow: 0 0 1.4em rgba(0, 0, 0, 0.22);
      }
      .cap-word {
        display: inline-block;
        padding: 0 0.12em;
        margin: 0 -0.07em;
        border-radius: 0.24em;
      }
      /* the word being spoken: white, with black text */
      .cap-word.on {
        background: #fff;
        color: #111;
      }
    </style>
  </head>
  <body>
    <div id="stage"></div>
    <script src="captures/marks.js" onerror="window.MARKS = {}; window.BURSTS = {}"></script>
    <script src="demo.js"></script>
    <script src="captions.js" onerror="window.CAPTIONS = null"></script>
    <script src="stage.js"></script>
  </body>
</html>
